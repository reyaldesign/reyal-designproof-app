# /etc/nginx/sites-available/proof  (then: certbot --nginx -d proof.yourdomain.com)
server {
    listen 80;
    server_name proof.yourdomain.com;
    client_max_body_size 100m;   # matches the upload limit

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
