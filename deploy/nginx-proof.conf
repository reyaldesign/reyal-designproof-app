# client.reyaldesign.com -> Reyal Design Studio on 127.0.0.1:3100. Installed by deploy/setup-vps.sh.
# HTTPS is added by certbot (it rewrites this file) once the DNS record points at this server.
server {
    listen 80;
    server_name client.reyaldesign.com;

    client_max_body_size 100m;   # PDF and image uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Website and Food Menu uploads in the AI Reviewer can be up to 250 MB. Only this path gets the bigger limit, and the upload is
    # passed straight through to the app (no copy on nginx's disk first). Everything else keeps the 100 MB limit above.
    location = /api/aireviewer/upload {
        client_max_body_size 260m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # PDF to image conversion on upload can take a while
    }
}
