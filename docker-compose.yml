# Used on the VPS (copied to /opt/reyal-proof by deploy). Locally you can also run: docker compose up --build
name: reyal-proof   # keeps this app's containers and network separate from every other compose project on the server
services:
  app:
    image: ghcr.io/reyaldesign/reyal-designproof-app:${TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
      DATA_DIR: /data
    volumes:
      - ./data:/data
    # nginx on the host proxies client.reyaldesign.com to this port.
    ports:
      - "127.0.0.1:3100:3000"
