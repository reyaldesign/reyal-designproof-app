# Every push to main: type-check, build the Docker image, publish it to GitHub Container Registry (ghcr.io),
# then the VPS pulls it, restarts, health-checks it and rolls back to the previous image if it fails.
# The database and uploads live in /opt/reyal-proof/data on the VPS and are never part of the image.
# One-time server setup: deploy/setup-vps.sh. Repo secrets needed for the deploy job: VPS_HOST, VPS_USER, VPS_SSH_KEY.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate && npx tsc --noEmit
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional push-button deploy. Off unless the repo variable AUTO_DEPLOY is set to true (Settings > Secrets and variables > Actions > Variables).
  deploy:
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://client.reyaldesign.com
    steps:
      - uses: actions/checkout@v4
      - name: Release on the VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$KEY" && test -n "$HOST" && test -n "$USER" || { echo 'Missing VPS_HOST, VPS_USER or VPS_SSH_KEY secret.' >&2; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          SSH=(-i "$RUNNER_TEMP/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/deploy/known-hosts" -o LogLevel=ERROR)
          scp "${SSH[@]}" docker-compose.yml "$USER@$HOST:/opt/reyal-proof/docker-compose.yml"
          ssh "${SSH[@]}" "$USER@$HOST" "SHA=$SHA" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/reyal-proof
          prev=$(cat .tag 2>/dev/null || true)
          [ -f data/app.db ] && cp data/app.db "backups/app-$(date -u +%Y%m%d-%H%M%S).db"
          ls -1t backups/app-*.db 2>/dev/null | tail -n +11 | xargs -r rm -f
          TAG=$SHA docker compose pull
          TAG=$SHA docker compose up -d
          for _ in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3100/login || true)
            if [ "$code" = 200 ]; then
              echo "$SHA" > .tag
              # Tidy only this app's old image tags (keep the current and the previous one).
              docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/reyaldesign/reyal-designproof-app:' | grep -v -e ":$SHA" -e ":latest" -e ":${prev:-none}" | xargs -r docker rmi >/dev/null 2>&1 || true
              echo 'Reyal Proof is up.'; exit 0
            fi
          done
          echo 'New version did not come up.' >&2
          docker compose logs --tail 40 app >&2 || true
          if [ -n "$prev" ]; then echo "Restoring $prev" >&2; TAG=$prev docker compose up -d; fi
          exit 1
          REMOTE
          rm -f "$RUNNER_TEMP/key"
